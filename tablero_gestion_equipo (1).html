<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero de Gestión de Equipo — Marketing Stine 2026/27</title>
<style>
:root{
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --bg:#FAFAF9; --surface-0:#F4F3F1; --surface-1:#FFFFFF; --surface-2:#F7F6F4;
  --border:#E7E5E1; --border-strong:#D6D3CE; --border-accent:#1C1B19;
  --text-primary:#1C1B19; --text-secondary:#57534E; --text-muted:#A8A29E;
  --accent:#B23A1E; --accent-soft:#FBEDE9; --radius:8px;
  --m1-bg:#FCEBE7; --m1-fg:#B23A1E; --m2-bg:#FAEEDA; --m2-fg:#8A5A0B;
  --m3-bg:#E4EEF6; --m3-fg:#2C5C86; --m4-bg:#E7F1E3; --m4-fg:#3B6D2E;
  --m5-bg:#E9E3F4; --m5-fg:#5B4B8A;
  --na-bg:#F1EFEC; --na-fg:#8C867C; --ok:#3B6D2E; --warn:#8A5A0B; --danger:#B23A1E;
  --edit:#FBF7EE;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1A1917; --surface-0:#211F1D; --surface-1:#252320; --surface-2:#2B2925;
    --border:#38352F; --border-strong:#4A463F; --border-accent:#F2F0EC;
    --text-primary:#F2F0EC; --text-secondary:#B7B2A9; --text-muted:#847E74;
    --accent:#E4805F; --accent-soft:#3A2620;
    --m1-bg:#3A2320; --m1-fg:#E9A08C; --m2-bg:#3A3120; --m2-fg:#E0BC7C;
    --m3-bg:#202E3A; --m3-fg:#8FBEE0; --m4-bg:#243421; --m4-fg:#9BCB88;
    --m5-bg:#2C2740; --m5-fg:#BBA8E0; --na-bg:#2A2824; --na-fg:#9A948A; --edit:#302A20;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text-primary);-webkit-font-smoothing:antialiased;line-height:1.5;padding:24px 20px 90px}
.wrap{max-width:1120px;margin:0 auto}
svg{display:block}
.i{width:16px;height:16px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i-sm{width:13px;height:13px}
button{font-family:inherit}
input,select,textarea{font-family:inherit}

/* editable inline */
.edit{outline:none;border-radius:4px;padding:1px 4px;margin:-1px -4px;transition:background .12s;cursor:text}
.edit:hover{background:var(--edit)}
.edit:focus{background:var(--edit);box-shadow:0 0 0 2px var(--border-strong)}
.edit:empty:before{content:attr(data-ph);color:var(--text-muted)}
.mini{cursor:pointer;background:none;border:none;color:var(--text-muted);padding:2px;border-radius:4px;display:inline-flex}
.mini:hover{color:var(--text-primary);background:var(--surface-2)}
.mini.del:hover{color:var(--danger)}
.addbtn{font-size:12px;font-weight:500;padding:7px 12px;border-radius:8px;border:1px dashed var(--border-strong);background:var(--surface-1);color:var(--text-secondary);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.addbtn:hover{border-color:var(--text-primary);color:var(--text-primary)}

/* header */
.header{padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.header .brand-bar{width:34px;height:3px;background:var(--accent);border-radius:3px;margin-bottom:12px}
.header h1{font-size:21px;font-weight:600;letter-spacing:-0.01em}
.header p{font-size:12.5px;color:var(--text-secondary);margin-top:5px;max-width:560px}
.toolbar{display:flex;gap:7px;flex-wrap:wrap}
.tbtn{font-size:12px;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:border-color .15s,color .15s}
.tbtn:hover{border-color:var(--border-strong);color:var(--text-primary)}

/* sheet tabs (como pestañas de Excel) */
.sheets{display:flex;gap:3px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:20px;align-items:center}
.sheet-tab{font-size:13px;padding:9px 14px;cursor:pointer;color:var(--text-secondary);border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:-1px;display:flex;align-items:center;gap:8px;font-weight:500;background:transparent}
.sheet-tab:hover{color:var(--text-primary);background:var(--surface-2)}
.sheet-tab.active{color:var(--text-primary);background:var(--surface-1);border-color:var(--border);border-bottom-color:var(--surface-1);font-weight:600}
.sheet-tab .ini2{width:22px;height:22px;border-radius:50%;background:var(--surface-0);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.sheet-tab.macro{font-weight:600}

/* macro */
.macro-intro{font-size:12.5px;color:var(--text-secondary);margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.macro-intro svg{margin-top:2px;flex-shrink:0}
.mtable-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;margin-bottom:16px}
table.mtable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
.mtable th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);font-weight:600;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.mtable td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.mtable tr:last-child td{border-bottom:none}
.mtable .pname{font-weight:600;font-size:13px}
.mtable .prole{font-size:11.5px;color:var(--text-secondary);margin-top:2px}
.mtable .openf{font-size:11.5px;color:var(--accent);cursor:pointer;background:none;border:none;padding:0;display:inline-flex;align-items:center;gap:4px}
.msel{font-size:11.5px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface-1);color:var(--text-primary)}
.mini-in{font-size:12px;padding:4px 7px;border:1px solid var(--border);border-radius:6px;background:var(--surface-1);color:var(--text-primary);width:100%}
.gd-note{font-size:12px;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.gd-note .tag{font-size:11px;background:var(--surface-0);border:1px solid var(--border);border-radius:16px;padding:2px 9px;color:var(--text-primary)}

/* employee detail */
.detail-head{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.initials{width:44px;height:44px;border-radius:50%;background:var(--surface-0);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--text-primary);flex-shrink:0}
.detail-head h2{font-size:19px;font-weight:600;letter-spacing:-0.01em}
.detail-head .role{font-size:12.5px;color:var(--text-secondary)}
.detail-metrics{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px;align-items:center}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary)}
.chip b{color:var(--text-primary);font-weight:600}
.chip.mat{background:var(--m2-bg);color:var(--m2-fg);border-color:transparent}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.tab{font-size:13px;padding:9px 15px;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;font-weight:500}
.tab.active{color:var(--text-primary);border-bottom-color:var(--border-accent)}
.tab:hover:not(.active){color:var(--text-primary)}
.tab-content{display:none}.tab-content.active{display:block}

.hint{font-size:12.5px;color:var(--text-secondary);margin-bottom:14px;display:flex;align-items:flex-start;gap:8px}
.hint svg{margin-top:2px;flex-shrink:0}

.mbadge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em;white-space:nowrap}
.m1{background:var(--m1-bg);color:var(--m1-fg)}.m2{background:var(--m2-bg);color:var(--m2-fg)}
.m3{background:var(--m3-bg);color:var(--m3-fg)}.m4{background:var(--m4-bg);color:var(--m4-fg)}
.m5{background:var(--m5-bg);color:var(--m5-fg)}.mna{background:var(--na-bg);color:var(--na-fg)}
.sbadge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-0);color:var(--text-secondary);border:1px solid var(--border);white-space:nowrap}
.estb{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:16px;white-space:nowrap;border:1px solid transparent}
.est-sin{background:var(--na-bg);color:var(--na-fg)}.est-curso{background:var(--m3-bg);color:var(--m3-fg)}
.est-riesgo{background:var(--m2-bg);color:var(--m2-fg)}.est-cumplido{background:var(--m4-bg);color:var(--m4-fg)}
.est-na{background:var(--surface-0);color:var(--text-muted);border-color:var(--border)}

.rc-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.rc-item,.obj-item{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.obj-item{margin-bottom:10px}
.rc-header,.obj-header{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.rc-header:hover,.obj-header:hover{background:var(--surface-2)}
.rc-num,.obj-w{flex-shrink:0}
.rc-num{width:26px;height:26px;border-radius:7px;background:var(--surface-0);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.obj-w{width:44px;text-align:center}
.obj-w .pct{font-size:14px;font-weight:600}
.obj-w .plbl{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.rc-title,.obj-title{flex:1;min-width:0}
.rc-title .t,.obj-title .t{font-size:13.5px;font-weight:600;letter-spacing:-0.005em}
.rc-title .meta,.obj-title .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.chev{color:var(--text-muted);transition:transform .2s}
.rc-item.open .chev,.obj-item.open .chev{transform:rotate(180deg)}
.rc-body,.obj-body{display:none}
.rc-item.open .rc-body,.obj-item.open .obj-body{display:block}
.rc-body{padding:2px 16px 14px}.obj-body{padding:0 16px 16px}
.cross{font-size:10.5px;padding:2px 8px;border-radius:16px;font-weight:600;display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent)}
.cross.none{background:var(--surface-0);color:var(--text-muted);border:1px solid var(--border);font-weight:500}
.avgmat{font-size:10.5px;color:var(--text-secondary);display:inline-flex;align-items:center;gap:4px}
.tagx{font-size:10.5px;padding:2px 8px;border-radius:16px;background:var(--surface-0);border:1px solid var(--border);color:var(--text-secondary);display:inline-flex;align-items:center;gap:4px}

.edit-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 12px;padding:9px 10px;background:var(--surface-2);border-radius:8px}
.edit-row .lbl{font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em}
.rtitle-edit{font-size:14px;font-weight:600;flex:1;min-width:140px}
.cross-editor{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cx{font-size:10.5px;padding:3px 8px;border-radius:14px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);cursor:pointer}
.cx.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}

.task{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--border)}
.task:first-child{border-top:none}
.task-badges{display:flex;flex-direction:column;gap:5px;align-items:flex-start;flex-shrink:0;width:82px}
.task-body{flex:1;min-width:0}
.task-body .txt{font-size:12.5px;color:var(--text-primary);line-height:1.55;font-weight:500}
.task-body .exp{font-size:12px;color:var(--text-secondary);line-height:1.55;margin-top:5px;padding-left:10px;border-left:2px solid var(--border)}
.task-obs{font-size:11.5px;color:var(--text-secondary);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.task-obs svg{margin-top:2px;color:var(--warn);flex-shrink:0}
.mat-sel{font-size:10.5px;font-weight:700;padding:3px 5px;border-radius:6px;border:1px solid var(--border);cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center}
.s-sel{font-size:10px;font-weight:600;padding:3px 5px;border-radius:6px;border:1px solid var(--border);background:var(--surface-0);color:var(--text-secondary);cursor:pointer}
.mprog{font-size:9.5px;color:var(--text-muted);display:inline-flex;align-items:center;gap:2px}
.tasknote{margin-top:7px;display:flex;gap:6px;align-items:center}
.tasknote input{flex:1;font-size:11.5px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text-primary)}
.tasknote input::placeholder{color:var(--text-muted)}
.stamp{font-size:10px;color:var(--text-muted);white-space:nowrap}
.task-tools{display:flex;justify-content:flex-end;margin-top:4px}

.pop-summary{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.pop-summary .top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pop-summary .big{font-size:26px;font-weight:600;line-height:1}
.pop-summary .lbl{font-size:11px;color:var(--text-muted)}
.pop-summary .bono{font-size:18px;font-weight:600;color:var(--text-primary)}
.pop-summary .counts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.cbadge{font-size:11px;padding:3px 9px;border-radius:16px;display:inline-flex;gap:5px;align-items:center}
.cbadge b{font-weight:700}

.track-box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin:12px 0}
.track-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.track-field{display:flex;flex-direction:column;gap:4px}
.track-field label{font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.track-field select{font-size:12.5px;padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface-1);color:var(--text-primary);cursor:pointer;min-width:130px}
.bit-title{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px;margin-bottom:9px}
.bit-list{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.bit-empty{font-size:12px;color:var(--text-muted);padding:4px 0}
.bit-entry{display:flex;gap:9px;align-items:flex-start;background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.bit-mes{font-size:10px;font-weight:700;color:var(--text-secondary);background:var(--surface-0);border-radius:5px;padding:2px 6px;white-space:nowrap;margin-top:1px}
.bit-txt{flex:1;min-width:0;font-size:12.5px;line-height:1.5}
.bit-txt .ev{display:block;font-size:11.5px;color:var(--accent);margin-top:3px;word-break:break-word}
.bit-txt .ev a{color:var(--accent)}
.bit-form{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.bit-form select,.bit-form input{font-size:12px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface-1);color:var(--text-primary)}
.bit-form .txt-in{flex:1;min-width:150px}.bit-form .ev-in{flex:1;min-width:130px}
.bit-add{font-size:12px;font-weight:500;padding:7px 12px;border-radius:7px;border:1px solid var(--text-primary);background:var(--text-primary);color:var(--bg);cursor:pointer;display:flex;align-items:center;gap:5px}

.smart{font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin:4px 0 12px;padding-left:12px;border-left:2px solid var(--border)}
.crit-toggle{font-size:11.5px;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 0;user-select:none}
.crit-toggle:hover{color:var(--text-primary)}
.crit-wrap{display:none;margin-top:6px}.crit-wrap.open{display:block}
.score-row{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--border);font-size:12px;line-height:1.5}
.score-row:first-child{border-top:none}
.score-n{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sc4{background:var(--m4-bg);color:var(--m4-fg)}.sc3{background:var(--m3-bg);color:var(--m3-fg)}
.sc2{background:var(--m2-bg);color:var(--m2-fg)}.sc1{background:var(--m1-bg);color:var(--m1-fg)}
.score-row .st{color:var(--text-secondary);flex:1}
.flag{margin-top:12px;background:var(--m2-bg);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text-primary);line-height:1.55;display:flex;gap:8px}
.flag svg{color:var(--warn);margin-top:1px}
.s1-box{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:16px}
.s1-box h4{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:9px}
.s1-box ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.s1-box li{font-size:12.5px;color:var(--text-secondary);line-height:1.5;display:flex;gap:8px}
.s1-box li b{color:var(--text-primary);font-weight:600}
.s1-box li svg{color:var(--ok);margin-top:2px}

.perfil-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media (max-width:720px){.perfil-grid{grid-template-columns:1fr}}
.panel{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:15px 16px}
.panel h3{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:13px}
.motiv-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.motiv-row .ml{font-size:12px;width:104px;flex-shrink:0;color:var(--text-primary)}
.motiv-track{flex:1;height:7px;background:var(--surface-0);border-radius:4px;overflow:hidden}
.motiv-fill{height:100%;background:var(--accent);border-radius:4px}
.motiv-row .mv{font-size:11px;color:var(--text-muted);width:44px;text-align:right}
.motiv-row .mv input{width:38px;font-size:11px;padding:2px 4px;border:1px solid var(--border);border-radius:5px;background:var(--surface-1);color:var(--text-primary);text-align:center}
.strat{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.strat .sl{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.strat li{font-size:12px;color:var(--text-secondary);line-height:1.5;display:flex;gap:8px;margin-bottom:6px;list-style:none}
.strat li svg{color:var(--accent);margin-top:2px}
.gap-list{display:flex;flex-direction:column;gap:10px}
.gap-item{border-left:2px solid var(--warn);padding:2px 0 2px 12px;position:relative}
.gap-item .gt{font-size:12.5px;font-weight:600;color:var(--text-primary)}
.gap-item .gd{font-size:12px;color:var(--text-secondary);line-height:1.5;margin-top:3px}
.gap-item .ge{font-size:11.5px;color:var(--text-muted);line-height:1.5;margin-top:3px;font-style:italic}
.gap-item .gdel{position:absolute;right:0;top:0}
.lider-note{background:var(--m2-bg);border-radius:10px;padding:13px 15px;margin-top:14px}
.lider-note .ll{font-size:11px;font-weight:600;color:var(--warn);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.lider-note p{font-size:12.5px;color:var(--text-primary);line-height:1.6}
.matinfo{font-size:12px;color:var(--text-secondary);line-height:1.55}
.matinfo .ml-row{display:flex;gap:9px;align-items:baseline;margin-bottom:7px}
.xmap table{width:100%;border-collapse:collapse;font-size:11.5px}
.xmap th,.xmap td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border)}
.xmap th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);font-weight:600}
.xmap td .yes{color:var(--accent);font-weight:600}.xmap td .no{color:var(--text-muted)}

const DEFAULT_GD=[{n:'Steffi Maggio',m:'M3'},{n:'Sofía Calamante',m:'M1'}];

/* ===================== DB (mutable + persist) ===================== */
const LSKEY='stine_tablero_2026_27_v2';
let DB=loadDB();
let activeSheet='equipo';
let activeTab={};

function clone(o){return JSON.parse(JSON.stringify(o));}
function loadDB(){
  let d=null;try{d=JSON.parse(localStorage.getItem(LSKEY));}catch(e){}
  if(!d||!d.personas){d={personas:clone(DEFAULT_PERSONAS),gd:clone(DEFAULT_GD),version:2};}
  normalize(d);return d;
}
function normalize(d){
  if(!d.gd)d.gd=clone(DEFAULT_GD);
  (d.personas||[]).forEach(p=>{
    if(!p.perfil)p.perfil={};PDIMS.forEach(k=>{if(typeof p.perfil[k]!=='number')p.perfil[k]=0;});
    if(!p.gaps)p.gaps=[];if(!p.s1)p.s1=[];if(!p.cierre)p.cierre={prom:'',bono:''};
    (p.pop||[]).forEach(o=>{if(o.estado===undefined)o.estado='';if(o.score===undefined)o.score='';if(!o.bitacora)o.bitacora=[];if(!o.scores)o.scores={};});
    (p.rendiciones||[]).forEach(r=>{if(r.cross===undefined)r.cross='none';(r.tasks||[]).forEach(t=>{if(t.m===undefined)t.m='na';});});
  });
}
function saveDB(){try{localStorage.setItem(LSKEY,JSON.stringify(DB));}catch(e){}}
function P(pid){return DB.personas.find(x=>x.id===pid);}

/* ===================== CÁLCULOS ===================== */
function bonoFor(avg){if(avg==null)return '—';if(avg<2.83)return 'Sin bono';if(avg<3.0)return '80%';if(avg<3.25)return '100%';return '110%';}
function projected(p){let s=0,n=0;(p.pop||[]).forEach(o=>{const v=parseInt(o.score);if(!isNaN(v)){s+=v;n++;}});const avg=n?s/n:null;return {avg:avg,n:n,bono:bonoFor(avg)};}
function estadoCounts(p){const c={sin:0,curso:0,riesgo:0,cumplido:0,na:0,vacio:0};(p.pop||[]).forEach(o=>{const e=o.estado||'';c[e||'vacio']=(c[e||'vacio']||0)+1;});return c;}
function matAvg(r){const v=[];(r.tasks||[]).forEach(t=>{const n=parseInt((t.m||'').replace('M',''));if(!isNaN(n))v.push(n);});return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}

/* ===================== SHEET NAV ===================== */
function renderSheets(){
  let html=`<div class="sheet-tab macro ${activeSheet==='equipo'?'active':''}" onclick="goSheet('equipo')">${icon('grid','i-sm')} Equipo (macro)</div>`;
  DB.personas.forEach(p=>{
    html+=`<div class="sheet-tab ${activeSheet===p.id?'active':''}" onclick="goSheet('${p.id}')"><span class="ini2">${esc(p.ini)}</span> ${esc(p.nombre.split(' ')[0])} ${esc(p.nombre.split(' ').slice(1).join(' '))}</div>`;
  });
  html+=`<div class="sheet-tab" onclick="addPerson()" title="Agregar persona">${icon('plus','i-sm')}</div>`;
  document.getElementById('sheets').innerHTML=html;
}
function goSheet(id){activeSheet=id;renderSheets();renderSheet();window.scrollTo({top:0,behavior:'smooth'});}
function renderSheet(){
  if(activeSheet==='equipo')document.getElementById('sheetHost').innerHTML=renderMacro();
  else{const p=P(activeSheet);if(!p){activeSheet='equipo';return renderSheet();}document.getElementById('sheetHost').innerHTML=renderEmployee(p);}
}

/* ===================== MACRO ===================== */
function renderMacro(){
  const intro=`<div class="macro-intro">${icon('grid','i-sm')}<span>Vista de conjunto del equipo (como la hoja <b>Equipo</b> del Excel). Todos los campos son editables. Entrá a la hoja de cada persona para su POP, rendiciones y perfil.</span></div>`;
  const rows=DB.personas.map(p=>{
    const pr=projected(p);
    const matOpts=['M1','M2','M3','M4','M5'].map(v=>`<option ${v===p.matGlobal?'selected':''}>${v}</option>`).join('');
    return `<tr>
      <td><div class="pname">${ed(esc(p.nombre),`setP('${p.id}','nombre',val(this))`)}</div>
          <div class="prole">${ed(esc(p.rol),`setP('${p.id}','rol',val(this))`)}</div>
          <button class="openf" onclick="goSheet('${p.id}')">${icon('open','i-sm')} Abrir hoja</button></td>
      <td><select class="msel" onchange="setP('${p.id}','matGlobal',this.value)">${matOpts}</select></td>
      <td><input class="mini-in" value="${esc(p.perfilTxt)}" onchange="setP('${p.id}','perfilTxt',this.value)"></td>
      <td><input class="mini-in" value="${esc(p.riesgo)}" onchange="setP('${p.id}','riesgo',this.value)"></td>
      <td><input class="mini-in" value="${esc(p.demanda)}" onchange="setP('${p.id}','demanda',this.value)"></td>
      <td>${pr.avg!=null?('<b>'+(Math.round(pr.avg*100)/100)+'</b> · '+pr.bono):'<span style="color:var(--text-muted)">—</span>'}</td>
      <td><button class="mini del" title="Eliminar persona" onclick="delPerson('${p.id}')">${icon('trash','i-sm')}</button></td>
    </tr>`;
  }).join('');
  const table=`<div class="mtable-wrap"><table class="mtable"><thead><tr>
      <th>Persona</th><th>Madurez global</th><th>Perfil motivacional</th><th>Grado de riesgo</th><th>Perfil demanda</th><th>Score proy.</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
  const gd=`<div class="gd-note">${icon('users','i-sm')}<span>Equipo de GD que reporta a Casaretto (Obj 5 de su POP):</span>${DB.gd.map((g,i)=>`<span class="tag">${esc(g.n)} · ${esc(g.m)} <button class="mini del" style="padding:0 2px" onclick="delGd(${i})">${icon('close','i-sm')}</button></span>`).join('')}</div>`;
  const addgd=`<button class="addbtn" onclick="addGd()">${icon('plus','i-sm')} Agregar integrante de GD</button>`;
  return intro+table+`<button class="addbtn" onclick="addPerson()" style="margin-bottom:16px">${icon('plus','i-sm')} Agregar persona al equipo</button>`+gd+addgd;
}
function setP(pid,f,v){P(pid)[f]=v;saveDB();if(f==='nombre'||f==='matGlobal')renderSheets();}
function addPerson(){
  const id='p'+Math.floor(performance.now());
  DB.personas.push({id:id,ini:'--',nombre:'Nueva persona',rol:'Rol · Sector',matGlobal:'M1',riesgo:'',demanda:'',perfilTxt:'',perfil:{Conocimiento:0,Orgullo:0,Seguridad:0,Moda:0,Interes:0,Comodidad:0,Afecto:0},cierre:{prom:'',bono:''},rendiciones:[],pop:[],s1:[],liderNote:'',gaps:[]});
  saveDB();activeSheet=id;renderSheets();renderSheet();
}
function delPerson(pid){const p=P(pid);if(!confirm('¿Eliminar a '+p.nombre+' y toda su información?'))return;DB.personas=DB.personas.filter(x=>x.id!==pid);if(activeSheet===pid)activeSheet='equipo';saveDB();renderSheets();renderSheet();}
function addGd(){DB.gd.push({n:'Nuevo · GD',m:'M1'});saveDB();renderSheet();}
function delGd(i){DB.gd.splice(i,1);saveDB();renderSheet();}

/* ===================== EMPLOYEE SHEET ===================== */
function renderEmployee(p){
  const tab=activeTab[p.id]||'pop';
  const iniEd=ed(esc(p.ini),`setP('${p.id}','ini',val(this));renderSheets()`,'', 'AC');
  return `<div class="detail">
    <div class="detail-head"><div class="initials">${iniEd}</div>
      <div><h2>${ed(esc(p.nombre),`setP('${p.id}','nombre',val(this))`)}</h2>
        <div class="role">${ed(esc(p.rol),`setP('${p.id}','rol',val(this))`)}</div></div></div>
    <div class="detail-metrics">
      <span class="chip mat">${icon('up','i-sm')} Madurez global <b>${esc(p.matGlobal)}</b></span>
      <span class="chip">Riesgo <b>${esc(p.riesgo||'—')}</b></span>
      <span class="chip">Demanda <b>${esc(p.demanda||'—')}</b></span>
      <span class="chip">Cierre 25/26 <b>${esc(p.cierre.prom||'—')}${p.cierre.bono?(' · '+esc(p.cierre.bono)):''}</b></span>
    </div>
    <div class="tabs">
      <div class="tab ${tab==='pop'?'active':''}" onclick="switchTab('${p.id}','pop',this)">${icon('target','i-sm')} POP 2026/27 · seguimiento</div>
      <div class="tab ${tab==='rend'?'active':''}" onclick="switchTab('${p.id}','rend',this)">${icon('check','i-sm')} Rendiciones &amp; madurez</div>
      <div class="tab ${tab==='perfil'?'active':''}" onclick="switchTab('${p.id}','perfil',this)">${icon('profile','i-sm')} Perfil &amp; gestión</div>
    </div>
    <div class="tab-content ${tab==='pop'?'active':''}" id="tc-pop">${renderPop(p)}</div>
    <div class="tab-content ${tab==='rend'?'active':''}" id="tc-rend">${renderRend(p)}</div>
    <div class="tab-content ${tab==='perfil'?'active':''}" id="tc-perfil">${renderPerfil(p)}</div>
  </div>`;
}
function switchTab(pid,tab,el){activeTab[pid]=tab;const host=el.closest('.detail');host.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');host.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));host.querySelector('#tc-'+tab).classList.add('active');}

/* ---------- POP ---------- */
function summaryHtml(p){
  const pr=projected(p),c=estadoCounts(p);const avgTxt=pr.avg!=null?(Math.round(pr.avg*100)/100):'—';
  return `<div class="top">
    <div><div class="lbl">Score proyectado (${pr.n}/${p.pop.length} con score)</div><div class="big">${avgTxt}</div></div>
    <div><div class="lbl">Bono proyectado</div><div class="bono">${pr.bono}</div></div>
    <div class="counts">
      <span class="cbadge est-cumplido"><b>${c.cumplido||0}</b> cumplidos</span>
      <span class="cbadge est-curso"><b>${c.curso||0}</b> en curso</span>
      <span class="cbadge est-riesgo"><b>${c.riesgo||0}</b> en riesgo</span>
      <span class="cbadge est-sin"><b>${(c.sin||0)+(c.vacio||0)}</b> sin iniciar</span>
    </div></div>`;
}
function renderPop(p){
  const summary=`<div class="pop-summary" id="pop-summary-${p.id}">${summaryHtml(p)}</div>`;
  const hint=`<div class="hint">${icon('book','i-sm')}<span>Cargá <b>estado</b> y <b>score proyectado</b> por objetivo y sumá evidencia en la <b>bitácora mensual</b>. Los textos también son editables. Todo se guarda solo; <b>Exportá</b> para respaldar.</span></div>`;
  const objs=p.pop.map((o,i)=>renderObj(p,o,i)).join('');
  const addObj=`<button class="addbtn" onclick="addObj('${p.id}')">${icon('plus','i-sm')} Agregar objetivo POP</button>`;
  const s1=`<div class="s1-box"><h4>${icon('check','i-sm')} S1 comprometido por el CMO — 2026/27</h4><ul id="s1-${p.id}">${
    p.s1.map((x,si)=>`<li>${icon('check','i-sm')}<span><b>${ed(esc(x[0]),`setS1('${p.id}',${si},0,val(this))`)}:</b> ${ed(esc(x[1]),`setS1('${p.id}',${si},1,val(this))`)}</span><button class="mini del" onclick="delS1('${p.id}',${si})">${icon('close','i-sm')}</button></li>`).join('')
  }</ul><button class="addbtn" style="margin-top:10px" onclick="addS1('${p.id}')">${icon('plus','i-sm')} Agregar compromiso S1</button></div>`;
  const scale=`<div class="hint" style="margin-top:14px">${icon('chart','i-sm')}<span>Escala de bono: promedio &lt;2.83 sin bono · 2.83 = 80% · 3.0 = 100% · 3.25 = 110%. NA no penaliza el promedio.</span></div>`;
  return summary+hint+`<div id="objlist-${p.id}">`+objs+`</div>`+addObj+s1+scale;
}
function renderObj(p,o,i){
  const est=estMeta(o.estado);
  const estOpts=ESTADOS.map(e=>`<option value="${e.v}" ${e.v===(o.estado||'')?'selected':''}>${e.l}</option>`).join('');
  const scoreOpts=['','1','2','3','4','NA'].map(v=>`<option value="${v}" ${v===(o.score||'')?'selected':''}>${v===''?'— Sin definir':v}</option>`).join('');
  const scores=[4,3,2,1].map(n=>`<div class="score-row"><div class="score-n sc${n}">${n}</div><div class="st">${ed(esc(o.scores[n]||''),`setCrit('${p.id}',${i},${n},val(this))`,'','Criterio score '+n)}</div></div>`).join('');
  return `<div class="obj-item" id="obj-${p.id}-${i}">
    <div class="obj-header" onclick="if(!event.target.closest('.no-toggle'))this.parentNode.classList.toggle('open')">
      <div class="obj-w"><div class="pct">${esc(o.peso||'')}</div><div class="plbl">peso</div></div>
      <div class="obj-title"><div class="t">${i+1}. <span id="objt-${p.id}-${i}">${esc(o.t)}</span></div>
        <div class="meta">
          <span class="estb ${est.cls}" id="estbadge-${p.id}-${i}">${est.v?est.l:'Sin estado'}</span>
          <span class="tagx" id="scbadge-${p.id}-${i}">${o.score?('Score '+o.score):'Sin score'}</span>
          <span class="tagx">${icon('link','i-sm')} ${esc(o.vinc||'')}</span>
          <span class="tagx">${icon('calendar','i-sm')} ${esc(o.fecha||'')}</span>
        </div></div>
      <button class="mini del no-toggle" title="Eliminar objetivo" onclick="delObj('${p.id}',${i})">${icon('trash','i-sm')}</button>
      ${icon('chevron','chev')}
    </div>
    <div class="obj-body">
      <div class="edit-row"><span class="lbl">Título</span>${ed(esc(o.t),`setObj('${p.id}',${i},'t',val(this));document.getElementById('objt-${p.id}-${i}').innerText=val(this)`,'rtitle-edit')}</div>
      <div class="edit-row"><span class="lbl">Peso</span>${ed(esc(o.peso||''),`setObj('${p.id}',${i},'peso',val(this))`,'','20%')}
        <span class="lbl">Vínculo</span>${ed(esc(o.vinc||''),`setObj('${p.id}',${i},'vinc',val(this))`,'','Ventas')}
        <span class="lbl">Fecha</span>${ed(esc(o.fecha||''),`setObj('${p.id}',${i},'fecha',val(this))`,'','Fecha clave')}</div>
      <div class="smart">${ed(esc(o.smart||''),`setObj('${p.id}',${i},'smart',val(this))`,'','Definición SMART...')}</div>
      <div class="track-box no-toggle">
        <div class="track-row">
          <div class="track-field"><label>Estado</label><select onchange="setEstado('${p.id}',${i},this.value)">${estOpts}</select></div>
          <div class="track-field"><label>Score proyectado</label><select onchange="setScore('${p.id}',${i},this.value)">${scoreOpts}</select></div>
        </div>
        <div class="bit-title">${icon('book','i-sm')} Bitácora mensual de evidencia</div>
        <div class="bit-list" id="bit-${p.id}-${i}">${bitListHtml(p,o,i)}</div>
        <div class="bit-form">
          <select id="bitmes-${p.id}-${i}">${MONTHS.map(mo=>`<option value="${mo.v}" ${mo.v===CURRENT_MONTH?'selected':''}>${mo.l}</option>`).join('')}</select>
          <input class="txt-in" id="bittxt-${p.id}-${i}" placeholder="Avance / evidencia del mes...">
          <input class="ev-in" id="bitev-${p.id}-${i}" placeholder="Link o referencia (opcional)">
          <button class="bit-add" onclick="addBit('${p.id}',${i})">${icon('plus','i-sm')} Agregar</button>
        </div>
      </div>
      <div class="crit-toggle no-toggle" onclick="this.nextElementSibling.classList.toggle('open')">${icon('chevron','i-sm')} Ver / editar criterios de score</div>
      <div class="crit-wrap">${scores}</div>
      <div class="flag">${icon('flag','i-sm')}${ed(esc(o.flag||''),`setObj('${p.id}',${i},'flag',val(this))`,'','Nota / alerta del objetivo...')}</div>
    </div></div>`;
}
function bitListHtml(p,o,i){
  const b=o.bitacora||[];
  if(!b.length)return '<div class="bit-empty">Sin registros todavía. Sumá el primer avance del mes ↓</div>';
  return b.slice().sort((a,c)=>a.mes<c.mes?-1:a.mes>c.mes?1:0).map(e=>{
    const ev=e.ev?`<span class="ev">${isUrl(e.ev)?`<a href="${esc(e.ev)}" target="_blank" rel="noopener">${esc(e.ev)}</a>`:esc(e.ev)}</span>`:'';
    return `<div class="bit-entry"><span class="bit-mes">${monthLabel(e.mes)}</span>
      <div class="bit-txt">${esc(e.txt)}${ev}</div>
      <button class="mini del" title="Eliminar" onclick="delBit('${p.id}',${i},'${e.id}')">${icon('trash','i-sm')}</button></div>`;
  }).join('');
}
function refreshObjHeader(pid,i){const o=P(pid).pop[i];const est=estMeta(o.estado);
  const eb=document.getElementById('estbadge-'+pid+'-'+i);if(eb){eb.className='estb '+est.cls;eb.textContent=est.v?est.l:'Sin estado';}
  const sb=document.getElementById('scbadge-'+pid+'-'+i);if(sb){sb.textContent=o.score?('Score '+o.score):'Sin score';}}
function refreshSummary(pid){const el=document.getElementById('pop-summary-'+pid);if(el)el.innerHTML=summaryHtml(P(pid));}
function setObj(pid,i,f,v){P(pid).pop[i][f]=v;saveDB();}
function setCrit(pid,i,n,v){P(pid).pop[i].scores[n]=v;saveDB();}
function setEstado(pid,i,v){P(pid).pop[i].estado=v;saveDB();refreshObjHeader(pid,i);refreshSummary(pid);}
function setScore(pid,i,v){P(pid).pop[i].score=v;saveDB();refreshObjHeader(pid,i);refreshSummary(pid);}
function addBit(pid,i){
  const mes=document.getElementById('bitmes-'+pid+'-'+i).value;
  const txt=document.getElementById('bittxt-'+pid+'-'+i).value.trim();
  const ev=document.getElementById('bitev-'+pid+'-'+i).value.trim();
  if(!txt){document.getElementById('bittxt-'+pid+'-'+i).focus();return;}
  P(pid).pop[i].bitacora.push({id:newId(),mes:mes,txt:txt,ev:ev});saveDB();
  document.getElementById('bit-'+pid+'-'+i).innerHTML=bitListHtml(P(pid),P(pid).pop[i],i);
  document.getElementById('bittxt-'+pid+'-'+i).value='';document.getElementById('bitev-'+pid+'-'+i).value='';
}
function delBit(pid,i,eid){const o=P(pid).pop[i];o.bitacora=o.bitacora.filter(e=>e.id!==eid);saveDB();document.getElementById('bit-'+pid+'-'+i).innerHTML=bitListHtml(P(pid),o,i);}
function addObj(pid){P(pid).pop.push({t:'Nuevo objetivo',peso:'',vinc:'',fecha:'',smart:'',scores:{4:'',3:'',2:'',1:''},flag:'',estado:'',score:'',bitacora:[]});saveDB();document.getElementById('tc-pop').innerHTML=renderPop(P(pid));}
function delObj(pid,i){if(!confirm('¿Eliminar este objetivo?'))return;P(pid).pop.splice(i,1);saveDB();document.getElementById('tc-pop').innerHTML=renderPop(P(pid));}
function setS1(pid,si,idx,v){P(pid).s1[si][idx]=v;saveDB();}
function addS1(pid){P(pid).s1.push(['Obj','compromiso...']);saveDB();document.getElementById('tc-pop').innerHTML=renderPop(P(pid));}
function delS1(pid,si){P(pid).s1.splice(si,1);saveDB();document.getElementById('tc-pop').innerHTML=renderPop(P(pid));}

/* ---------- RENDICIONES ---------- */
function crossChip(cross,p){
  if(cross==='none'||!cross)return `<span class="cross none">${icon('dot','i-sm')} Sin cruce POP — operativo</span>`;
  return cross.map(idx=>`<span class="cross">${icon('link','i-sm')} POP ${idx}</span>`).join(' ');
}
function madSelect(pid,ri,ti,cur){
  const cls=madCls(cur);const opts=['M1','M2','M3','M4','na'].map(v=>`<option value="${v}" ${v===cur?'selected':''}>${v==='na'?'NA':v}</option>`).join('');
  return `<select class="mat-sel ${cls}" onchange="setMad('${pid}',${ri},${ti},this.value)">${opts}</select>`;
}
function sSelect(pid,ri,ti,cur){const opts=['','S1','S2','S3','S4'].map(v=>`<option value="${v}" ${v===(cur||'')?'selected':''}>${v===''?'—':v}</option>`).join('');return `<select class="s-sel" onchange="setLider('${pid}',${ri},${ti},this.value)">${opts}</select>`;}
function renderRend(p){
  const hint=`<div class="hint">${icon('book','i-sm')}<span>Rendiciones editables (como el Excel): cambiá títulos y tareas, ajustá <b>madurez (M1–M4)</b> y <b>liderazgo (S1–S4)</b>, y dejá nota de evidencia. Los cambios de madurez se sellan con el mes en curso (${monthLabel(CURRENT_MONTH)}).</span></div>`;
  return hint+`<div class="rc-list" id="rclist-${p.id}">`+p.rendiciones.map((r,ri)=>renderRendItem(p,r,ri)).join('')+`</div>`+
    `<button class="addbtn" onclick="addRend('${p.id}')">${icon('plus','i-sm')} Agregar rendición de cuentas</button>`;
}
function renderRendItem(p,r,ri){
  const avg=matAvg(r);const avgTxt=avg?('Madurez prom. M'+(Math.round(avg*10)/10)):'Sin evaluar';
  const crossEd=[1,2,3,4,5,6].map(n=>{const on=(r.cross!=='none'&&r.cross&&r.cross.indexOf(n)>=0);return `<span class="cx ${on?'on':''}" onclick="toggleCross('${p.id}',${ri},${n})">POP ${n}</span>`;}).join('')+`<span class="cx ${(r.cross==='none'||!r.cross)?'on':''}" onclick="setCrossNone('${p.id}',${ri})">Operativo</span>`;
  const tasks=r.tasks.map((t,ti)=>renderTask(p,r,ri,t,ti)).join('');
  return `<div class="rc-item" id="rc-${p.id}-${ri}">
    <div class="rc-header" onclick="if(!event.target.closest('.no-toggle'))this.parentNode.classList.toggle('open')">
      <div class="rc-num">${ri+1}</div>
      <div class="rc-title"><div class="t" id="rct-${p.id}-${ri}">${esc(r.title)}</div>
        <div class="meta">${crossChip(r.cross,p)}<span class="avgmat" id="rcavg-${p.id}-${ri}">${icon('up','i-sm')} ${avgTxt}</span><span class="avgmat">${r.tasks.length} tareas</span></div></div>
      <button class="mini del no-toggle" title="Eliminar rendición" onclick="delRend('${p.id}',${ri})">${icon('trash','i-sm')}</button>
      ${icon('chevron','chev')}
    </div>
    <div class="rc-body">
      <div class="edit-row"><span class="lbl">Rendición</span>${ed(esc(r.title),`setRendTitle('${p.id}',${ri},val(this))`,'rtitle-edit')}</div>
      <div class="edit-row"><span class="lbl">Cruce POP</span><span class="cross-editor">${crossEd}</span></div>
      <div id="tasks-${p.id}-${ri}">${tasks}</div>
      <button class="addbtn" style="margin-top:10px" onclick="addTask('${p.id}',${ri})">${icon('plus','i-sm')} Agregar tarea</button>
    </div></div>`;
}
function renderTask(p,r,ri,t,ti){
  const baseRef=(t.m0&&t.m0!==t.m)?`<span class="mprog">base ${t.m0} ${icon('arrow','i-sm')}</span>`:'';
  const exp=(t.exp!==undefined)?`<div class="exp">${ed(esc(t.exp||''),`setTask('${p.id}',${ri},${ti},'exp',val(this))`,'','Qué esperamos lograr...')}</div>`:'';
  const obs=(t.note!==undefined)?`<div class="task-obs">${icon('alert','i-sm')}${ed(esc(t.note||''),`setTask('${p.id}',${ri},${ti},'note',val(this))`,'','Observación...')}</div>`:'';
  const stamp=t.mes?`<span class="stamp" id="stamp-${p.id}-${ri}-${ti}">${monthLabel(t.mes)}</span>`:`<span class="stamp" id="stamp-${p.id}-${ri}-${ti}"></span>`;
  return `<div class="task" id="task-${p.id}-${ri}-${ti}">
    <div class="task-badges">${baseRef}${madSelect(p.id,ri,ti,t.m)}${sSelect(p.id,ri,ti,t.s)}</div>
    <div class="task-body">
      <div class="txt">${ed(esc(t.t),`setTask('${p.id}',${ri},${ti},'t',val(this))`,'','Tarea...')}</div>${exp}${obs}
      <div class="tasknote"><input value="${esc(t.evNote||'')}" placeholder="Nota / evidencia de madurez..." onchange="setEvNote('${p.id}',${ri},${ti},this.value)">${stamp}</div>
      <div class="task-tools"><button class="mini del" title="Eliminar tarea" onclick="delTask('${p.id}',${ri},${ti})">${icon('trash','i-sm')}</button></div>
    </div></div>`;
}
function refreshRendItem(pid,ri){const p=P(pid);const el=document.getElementById('rc-'+pid+'-'+ri);if(el){const open=el.classList.contains('open');el.outerHTML=renderRendItem(p,p.rendiciones[ri],ri);if(open)document.getElementById('rc-'+pid+'-'+ri).classList.add('open');}}
function refreshRendList(pid){document.getElementById('rclist-'+pid).innerHTML=P(pid).rendiciones.map((r,ri)=>renderRendItem(P(pid),r,ri)).join('');}
function refreshRendAvg(pid,ri){const p=P(pid);const avg=matAvg(p.rendiciones[ri]);const el=document.getElementById('rcavg-'+pid+'-'+ri);if(el)el.innerHTML=icon('up','i-sm')+' '+(avg?('Madurez prom. M'+(Math.round(avg*10)/10)):'Sin evaluar');}
function setRendTitle(pid,ri,v){P(pid).rendiciones[ri].title=v;saveDB();const el=document.getElementById('rct-'+pid+'-'+ri);if(el)el.innerText=v;}
function setTask(pid,ri,ti,f,v){P(pid).rendiciones[ri].tasks[ti][f]=v;saveDB();}
function setMad(pid,ri,ti,v){const t=P(pid).rendiciones[ri].tasks[ti];t.m=v;t.mes=CURRENT_MONTH;saveDB();const sel=event.target;sel.className='mat-sel '+madCls(v);const st=document.getElementById('stamp-'+pid+'-'+ri+'-'+ti);if(st)st.textContent=monthLabel(CURRENT_MONTH);refreshRendAvg(pid,ri);}
function setLider(pid,ri,ti,v){P(pid).rendiciones[ri].tasks[ti].s=v;saveDB();}
function setEvNote(pid,ri,ti,v){const t=P(pid).rendiciones[ri].tasks[ti];t.evNote=v;if(!t.mes)t.mes=CURRENT_MONTH;saveDB();const st=document.getElementById('stamp-'+pid+'-'+ri+'-'+ti);if(st&&!st.textContent)st.textContent=monthLabel(t.mes);}
function toggleCross(pid,ri,n){const r=P(pid).rendiciones[ri];if(r.cross==='none'||!r.cross)r.cross=[];const k=r.cross.indexOf(n);if(k>=0)r.cross.splice(k,1);else r.cross.push(n);r.cross.sort((a,b)=>a-b);if(!r.cross.length)r.cross='none';saveDB();refreshRendItem(pid,ri);}
function setCrossNone(pid,ri){P(pid).rendiciones[ri].cross='none';saveDB();refreshRendItem(pid,ri);}
function addTask(pid,ri){P(pid).rendiciones[ri].tasks.push({t:'Nueva tarea',m:'na',s:''});saveDB();document.getElementById('tasks-'+pid+'-'+ri).innerHTML=P(pid).rendiciones[ri].tasks.map((t,ti)=>renderTask(P(pid),P(pid).rendiciones[ri],ri,t,ti)).join('');refreshRendAvg(pid,ri);}
function delTask(pid,ri,ti){P(pid).rendiciones[ri].tasks.splice(ti,1);saveDB();document.getElementById('tasks-'+pid+'-'+ri).innerHTML=P(pid).rendiciones[ri].tasks.map((t,i2)=>renderTask(P(pid),P(pid).rendiciones[ri],ri,t,i2)).join('');refreshRendAvg(pid,ri);}
function addRend(pid){P(pid).rendiciones.push({title:'Nueva rendición de cuentas',cross:'none',tasks:[{t:'Nueva tarea',m:'na',s:''}]});saveDB();refreshRendList(pid);const els=document.querySelectorAll('#rclist-'+pid+' .rc-item');if(els.length)els[els.length-1].classList.add('open');}
function delRend(pid,ri){if(!confirm('¿Eliminar esta rendición y sus tareas?'))return;P(pid).rendiciones.splice(ri,1);saveDB();refreshRendList(pid);}

/* ---------- PERFIL ---------- */
function renderPerfil(p){
  const maxv=Math.max(3,...PDIMS.map(d=>p.perfil[d]||0));
  const motiv=PDIMS.map(d=>`<div class="motiv-row"><div class="ml">${d}</div>
      <div class="motiv-track"><div class="motiv-fill" style="width:${((p.perfil[d]||0)/maxv)*100}%"></div></div>
      <div class="mv"><input type="number" min="0" max="5" value="${p.perfil[d]||0}" onchange="setMotiv('${p.id}','${d}',this.value)"></div></div>`).join('');
  const dom=PDIMS.filter(d=>p.perfil[d]>0).sort((a,b)=>p.perfil[b]-p.perfil[a]).slice(0,2);
  const strat=dom.length?dom.map(d=>`<li>${icon('spark','i-sm')}<span><b style="color:var(--text-primary)">${d}:</b> ${PERFILES[d]?PERFILES[d].e:''}</span></li>`).join(''):'<li style="color:var(--text-muted)">Cargá los puntajes para ver estrategias sugeridas.</li>';
  const motivPanel=`<div class="panel"><h3>${icon('profile','i-sm')} Perfil motivacional <span style="font-weight:400;color:var(--text-muted);font-size:11px">(0–3)</span></h3>${motiv}
    <div class="strat"><div class="sl">Cómo motivarlo</div><ul>${strat}</ul></div></div>`;
  const gapsPanel=`<div class="panel"><h3>${icon('alert','i-sm')} Brechas y riesgos a gestionar</h3>
    <div class="gap-list" id="gaps-${p.id}">${p.gaps.map((g,gi)=>gapHtml(p,g,gi)).join('')||'<div style="font-size:12px;color:var(--text-muted)">Sin brechas cargadas.</div>'}</div>
    <button class="addbtn" style="margin-top:12px" onclick="addGap('${p.id}')">${icon('plus','i-sm')} Agregar brecha</button></div>`;
  const liderNote=`<div class="lider-note"><div class="ll">${icon('alert','i-sm')} Nota del líder — cómo abordarlo</div><p>${ed(esc(p.liderNote||''),`setP('${p.id}','liderNote',val(this))`,'','Nota del líder...')}</p></div>`;
  const xrows=p.rendiciones.map((r,ri)=>{const cr=(r.cross==='none'||!r.cross)?'<span class="no">Sin cruce (operativo)</span>':r.cross.map(i=>'<span class="yes">POP '+i+'</span>').join(', ');return `<tr><td>${ri+1}. ${esc(r.title)}</td><td>${cr}</td></tr>`;}).join('');
  const xmap=`<div class="panel xmap" style="grid-column:1/-1"><h3>${icon('link','i-sm')} Cruces rendiciones ↔ POP 2026/27</h3>
    <table><thead><tr><th>Rendición de cuentas</th><th>Objetivo POP vinculado</th></tr></thead><tbody>${xrows||'<tr><td colspan="2" style="color:var(--text-muted)">Sin rendiciones.</td></tr>'}</tbody></table></div>`;
  return `<div class="perfil-grid">${motivPanel}${gapsPanel}</div>${liderNote}<div class="perfil-grid" style="margin-top:14px">${xmap}</div>`;
}
function gapHtml(p,g,gi){return `<div class="gap-item"><button class="mini del gdel" onclick="delGap('${p.id}',${gi})">${icon('close','i-sm')}</button>
    <div class="gt">${ed(esc(g.gt),`setGap('${p.id}',${gi},'gt',val(this))`,'','Título de la brecha')}</div>
    <div class="gd">${ed(esc(g.gd),`setGap('${p.id}',${gi},'gd',val(this))`,'','Descripción')}</div>
    <div class="ge">${ed(esc(g.ge||''),`setGap('${p.id}',${gi},'ge',val(this))`,'','Ejemplo / cómo cerrarla')}</div></div>`;}
function setMotiv(pid,d,v){P(pid).perfil[d]=parseInt(v)||0;saveDB();document.getElementById('tc-perfil').innerHTML=renderPerfil(P(pid));}
function setGap(pid,gi,f,v){P(pid).gaps[gi][f]=v;saveDB();}
function addGap(pid){P(pid).gaps.push({gt:'Nueva brecha',gd:'',ge:''});saveDB();document.getElementById('gaps-'+pid).innerHTML=P(pid).gaps.map((g,gi)=>gapHtml(P(pid),g,gi)).join('');}
function delGap(pid,gi){P(pid).gaps.splice(gi,1);saveDB();document.getElementById('gaps-'+pid).innerHTML=P(pid).gaps.map((g,gi2)=>gapHtml(P(pid),g,gi2)).join('')||'<div style="font-size:12px;color:var(--text-muted)">Sin brechas cargadas.</div>';}

/* ===================== REPORTE MENSUAL ===================== */
function openReport(){
  document.getElementById('reportBody').innerHTML=`
    <div class="modal-head"><h2>${icon('chart')} Reporte mensual de evidencia</h2>
      <select id="reportMonth" onchange="renderReport(this.value)">${MONTHS.map(mo=>`<option value="${mo.v}" ${mo.v===CURRENT_MONTH?'selected':''}>${mo.l}</option>`).join('')}</select>
      <button class="close" onclick="closeReport()">${icon('close')}</button></div>
    <div id="reportContent"></div>`;
  renderReport(CURRENT_MONTH);document.getElementById('reportOverlay').classList.add('open');
}
function closeReport(){document.getElementById('reportOverlay').classList.remove('open');}
function renderReport(mes){
  const html=DB.personas.map(p=>{
    const objs=(p.pop||[]).map((o,i)=>{
      const est=estMeta(o.estado);const entries=(o.bitacora||[]).filter(e=>e.mes===mes);
      const evs=entries.length?entries.map(e=>`<div class="rep-ev">${esc(e.txt)}${e.ev?` <span class="ev">· ${isUrl(e.ev)?`<a href="${esc(e.ev)}" target="_blank" rel="noopener">${esc(e.ev)}</a>`:esc(e.ev)}</span>`:''}</div>`).join(''):`<div class="rep-none">Sin evidencia cargada este mes.</div>`;
      return `<div class="rep-obj"><div class="roh"><span class="estb ${est.cls}">${est.v?est.l:'Sin estado'}</span><span class="rot">${i+1}. ${esc(o.t)}</span><span class="tagx">${o.score?('Score '+o.score):'—'}</span></div>${evs}</div>`;
    }).join('');
    const madUpd=[];(p.rendiciones||[]).forEach((r,ri)=>{(r.tasks||[]).forEach(t=>{if(t.mes===mes&&(t.evNote||t.m)){madUpd.push(`R${ri+1} · ${esc(r.title)}: ${esc(t.m||'')}${t.evNote?(' — '+esc(t.evNote)):''}`);}});});
    const madBlock=madUpd.length?`<div class="rep-mat"><b>Madurez actualizada este mes:</b><br>${madUpd.join('<br>')}</div>`:'';
    return `<div class="rep-person"><h4><span class="initials" style="width:30px;height:30px;font-size:11px">${esc(p.ini)}</span> ${esc(p.nombre)}</h4>${objs||'<div class="rep-none">Sin objetivos.</div>'}${madBlock}</div>`;
  }).join('');
  document.getElementById('reportContent').innerHTML=html;
}

/* ===================== EXPORT / IMPORT / RESET ===================== */
function doExport(){
  const payload={app:'stine-tablero-gestion',version:2,exportedMonth:CURRENT_MONTH,db:DB};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='tablero_stine_2026_27.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function doImport(input){
  const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();
  reader.onload=function(){try{const data=JSON.parse(reader.result);const d=data&&data.db?data.db:data;
    if(d&&d.personas){DB=d;normalize(DB);saveDB();activeSheet='equipo';renderSheets();renderSheet();alert('Tablero importado correctamente.');}
    else alert('El archivo no tiene el formato esperado.');}catch(e){alert('No se pudo leer el archivo: '+e.message);}input.value='';};
  reader.readAsText(file);
}
function resetAll(){if(!confirm('¿Restaurar los datos base y borrar tus cambios guardados? (Exportá antes si querés conservarlos)'))return;DB={personas:clone(DEFAULT_PERSONAS),gd:clone(DEFAULT_GD),version:2};normalize(DB);saveDB();activeSheet='equipo';renderSheets();renderSheet();}

    <h3>${icon('up','i-sm')} Madurez — la escalera de delegación</h3>
    <div class="ladder">${LADDER.map(l=>`<div class="rung"><span class="rc mbadge ${l.cls}">${l.c}</span><div class="rt">${l.t}</div><div class="rd">${l.d}</div></div>`).join('')}</div>
    <h3>${icon('users','i-sm')} Estilo de liderazgo (situacional)</h3>
    <div class="ladder">${STYLES.map(s=>`<div class="rung"><span class="rc sbadge">${s.c}</span><div class="rt">${s.t}</div><div class="rd">${s.d}</div></div>`).join('')}</div>
    <h3>${icon('profile','i-sm')} Perfiles motivacionales</h3>
    <div class="prof-grid">${Object.keys(PERFILES).map(k=>`<div class="prof"><div class="pn">${k}</div><div class="pd">${PERFILES[k].d}</div><div class="pe"><b>Estrategia:</b> ${PERFILES[k].e}</div></div>`).join('')}</div>`;

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLegend();closeReport();}});
