[[imagenes]]            # BLACK tachado + GREEN, FRIDAY
archivo = "assets/green_black_friday.png"
ancho   = 540
y       = 708
aparece = 11.5

[[imagenes]]            # logo de Stine (el "STINE" negro se pasa a blanco sobre fondo oscuro)
archivo = "assets/logo_stine.png"
ancho   = 230
y       = 946
aparece = 11.9
oscuro_a_blanco = true

[sonido]
activado      = true
puerta        = true    # chirrido al abrir
disparos      = true    # disparo + golpe seco en cada bolsa y ráfaga en los flashes
musica        = true    # entra en el cierre
volumen_musica = 0.55
