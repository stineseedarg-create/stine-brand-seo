# ─────────────────────────────────────────────────────────────
#  VIDEO DE PRODUCTO STINE – tomas de Higgsfield + montaje con foco y luz
#  1. Generá en Higgsfield las tomas de PROMPTS_HIGGSFIELD.md y guardalas en clips/ con estos nombres.
#  2. python3 montaje.py   → salida/stine-producto-9x16.mp4 + cuadro final
#  Si falta un clip, se usa el cuadro de inicio con un movimiento lento (animatic).
#  "desde" = segundo del clip desde donde se usa. Tiempos en segundos.
# ─────────────────────────────────────────────────────────────

[salida]
video        = "salida/stine-producto-9x16.mp4"
cuadro_final = "salida/stine-producto-cuadro-final.png"
