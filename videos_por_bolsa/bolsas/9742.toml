# ─────────────────────────────────────────────────────────────
#  VIDEO ANIMADO – ST 9742 RG · Los Cortos (sin Viptera3)
#  python3 animado.py bolsas/9742.toml                → salida/stine-9742-9x16.mp4
#  python3 animado.py bolsas/9742.toml --test 1,2.5   → cuadros de prueba
#  Tiempos en segundos (cortes cada 0,5 s = 120 BPM, para sumar música a tempo).
#  centro = punto de la foto (1080x1920) hacia donde mira la cámara. zoom >1 = más cerca.
#  entrada: "corte" | "enfoque" | "flash" | "whip_izq" | "whip_der" | "whip_arriba" | "whip_abajo"
#  curva:   "suave" | "snap" (zoom de golpe) | "lineal" | "acelera"
#  Si agregás clip = "clips/xxx.mp4" (Higgsfield), se usa el clip en lugar de la foto.
# ─────────────────────────────────────────────────────────────
[general]
video = "salida/stine-9742-9x16.mp4"

[efecto]
desenfoque_max = 28
duracion_foco = 0.30
barrido_px = 170
temblor = 1.4
golpe_corte = 9
congelado = 0.14      # cuánto dura el cuadro congelado de cada "foto"
grano = 0.03
halo = 0.30
vineta = 0.30
fundido_final = 0.35

[sonido]
# disparos de cámara, barridos y golpes van siempre. Para sumar música: musica = "musica.mp3"
musica = ""
volumen_musica = 0.6

# [t, "flash"] = destello · [t, "foto"] = destello + cuadro congelado
flashes = [[0.5, "foto"], [1.0, "flash"], [2.25, "foto"], [3.75, "flash"], [4.5, "flash"], [5.1, "flash"], [5.25, "flash"], [5.45, "foto"], [6.55, "flash"], [6.7, "flash"], [6.85, "foto"], [7.3, "flash"], [7.45, "flash"], [7.8, "foto"], [8.6, "foto"]]

